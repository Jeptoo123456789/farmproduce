services:
  - type: web
    name: farmproduce-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FARMMARKET_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: farmproduce-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_API_BASE_URL
        sync: false